name: Build, Test & Deploy Analyst Assist to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_REGION: asia-south1
  ARTIFACT_REPO: northgate-chase-repo
  SERVICE_NAME: ekyc-analyst-assist  # do NOT change: northgate-chase is a separate live app

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: uv sync --extra dev

      - name: Run Backend Pytest Suite
        working-directory: ./backend
        run: uv run pytest -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm run build

  deploy:
    name: Build Docker Container & Deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: ">= 460.0.0"

      - name: Configure Cloud SDK & Docker
        run: |
          PROJECT_ID="${{ steps.auth.outputs.project_id }}"
          gcloud config set project "${PROJECT_ID}" --quiet

          echo "Authenticated as: $(gcloud config get-value account)"

          # Fail loudly if the repository is missing and cannot be created
          if ! gcloud artifacts repositories describe "${{ env.ARTIFACT_REPO }}" \
               --location="${{ env.GCP_REGION }}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            echo "Artifact Registry repo not found, creating it..."
            gcloud artifacts repositories create "${{ env.ARTIFACT_REPO }}" \
              --repository-format=docker \
              --location="${{ env.GCP_REGION }}" \
              --description="Docker repository for Northgate Chase" \
              --project="${PROJECT_ID}" \
              --quiet
          fi

          gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build Docker Image
        run: |
          PROJECT_ID="${{ steps.auth.outputs.project_id }}"
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}"
          docker build --platform linux/amd64 -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .

      - name: Push Docker Image
        run: |
          PROJECT_ID="${{ steps.auth.outputs.project_id }}"
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}"
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          PROJECT_ID="${{ steps.auth.outputs.project_id }}"
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image "${IMAGE_TAG}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --timeout 300s \
            --set-env-vars="CHASEZERO_FRONTEND_DIR=/app/frontend_dist,CHASEZERO_DB_PATH=/tmp/chasezero.db" \
            --project "${PROJECT_ID}" \
            --quiet

          SERVICE_URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" --region "${{ env.GCP_REGION }}" --format="value(status.url)" --project "${PROJECT_ID}")
          echo "SERVICE_URL=${SERVICE_URL}" >> $GITHUB_ENV
          echo "Deployed successfully to: ${SERVICE_URL}"

      - name: Smoke Test Deployed Service
        run: |
          echo "Testing ${SERVICE_URL}/api/health..."
          curl -f -s "${SERVICE_URL}/api/health" || exit 1
          echo "Testing ${SERVICE_URL}/..."
          curl -f -s -I "${SERVICE_URL}/" || exit 1
